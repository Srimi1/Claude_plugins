[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eno-plugin"
version = "0.1.0"
description = "Eno Claude plugin for vibe coding and Vercel go-live workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Eno Team"}
]
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
eno = "eno.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
